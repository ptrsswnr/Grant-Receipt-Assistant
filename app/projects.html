<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โครงการของฉัน — Grant Receipt Assistant</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/auth-guard.js" defer></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="js/google-drive.js" defer></script>
</head>
<body>

<div id="nav"></div>

<main class="page-shell">

  <div class="section page-head">
    <div>
      <h1>โครงการของฉัน</h1>
      <p class="text-body">โครงการวิจัยที่คุณดูแลอยู่</p>
    </div>
    <button type="button" class="btn btn-primary btn-md" id="showAddProjectButton" aria-expanded="false" aria-controls="addProjectSection">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      เพิ่มโครงการ
    </button>
  </div>

  <div class="section" id="addProjectSection" hidden>
    <div class="card">
      <h2>เพิ่มโครงการใหม่</h2>
      <p class="help-text">แหล่งทุนเป็นข้อมูลกลางที่ผู้ดูแลระบบ (admin) เพิ่มไว้</p>
      <div id="warningBox" class="banner banner--error" style="display:none;"></div>

      <div class="field">
        <label for="projectName">ชื่อโครงการวิจัย</label>
        <input type="text" id="projectName">
      </div>
      <div class="field">
        <label for="fundSourceId">แหล่งทุน</label>
        <select id="fundSourceId"></select>
      </div>
      <fieldset class="field contract-fields">
        <legend>ระยะเวลาสัญญา</legend>
        <p class="help-text">วันที่ในใบเสร็จต้องอยู่ในช่วงนี้ ใบเสร็จนอกช่วงจะเบิกไม่ได้</p>
        <div class="contract-fields__row">
          <div class="field">
            <label for="contractStartDate">วันเริ่มสัญญา</label>
            <input type="date" id="contractStartDate">
          </div>
          <div class="field">
            <label for="contractEndDate">วันสิ้นสุดสัญญา</label>
            <input type="date" id="contractEndDate">
          </div>
        </div>
      </fieldset>

      <div class="row" style="justify-content:flex-end;">
        <button type="button" class="btn btn-secondary btn-md" id="cancelAddProjectButton">ยกเลิก</button>
        <button type="button" class="btn btn-primary btn-md" id="addProjectButton">บันทึกโครงการ</button>
      </div>
    </div>
  </div>

  <div id="load-state" class="section">
    <p class="text-body">กำลังโหลดโครงการของคุณ...</p>
  </div>

  <div id="project-list" class="section" style="display:none;"></div>

</main>

<script src="js/projects.js" defer></script>

</body>
</html>
